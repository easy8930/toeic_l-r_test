name: Deploy Listening Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Test ZIP splitting utility
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: python -m pip install -r scripts/requirements-browser.txt
      - name: Install Chromium for playback tests
        run: python -m playwright install --with-deps chromium
      - name: Verify theme selection (no audio)
        run: python scripts/theme_smoke.py
      - name: Verify actual group audio playback
        if: ${{ !contains(github.event.head_commit.message, '[skip audio tests]') }}
        run: python scripts/group_playback_smoke.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build for repository URL
        run: npm run build -- --base=/toeic_l-r_test/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
